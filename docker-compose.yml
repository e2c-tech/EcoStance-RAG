version: '3.8'

services:
  # 1. Message Broker (REQUIRED for Celery)
  redis:
    image: redis:alpine
    container_name: ecostance-redis
    restart: unless-stopped
    networks:
      - app-network

  # 2. Shared Embedding Server (The Model Owner)
  # This container loads the BGE-M3 model and serves vectors on port 9003
  ecostance-embedding:
    build:
      context: ./ecostance-agent-v1
      dockerfile: Dockerfile
    container_name: ecostance-embedding
    command: python -m app.services.embedding_server
    environment:
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-BAAI/bge-m3}
      - EMBEDDING_SERVER_PORT=9003
      - GPU_VRAM_LIMIT_MB=${GPU_VRAM_LIMIT_MB:-8192}
      - EMBEDDING_VECTOR_SIZE=${EMBEDDING_VECTOR_SIZE:-1024}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - app-network

  # 3. Main API Server (Now Lightweight)
  ecostance-agent:
    build:
      context: ./ecostance-agent-v1
      dockerfile: Dockerfile
    container_name: ecostance-agent
    environment:
      # Hybrid Config
      - REDIS_URL=redis://redis:6379/0
      - USE_REMOTE_EMBEDDING=true
      - EMBEDDING_SERVER_HOST=ecostance-embedding
      - EMBEDDING_SERVER_PORT=9003
      # Existing Config
      - DATABASE_URL=${DATABASE_URL}
      - QDRANT_URL=${QDRANT_URL}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - AGENT_MODEL=${AGENT_MODEL:-llama-3.1-8b-instant}
      - AGENT_TEMPERATURE=${AGENT_TEMPERATURE:-0.3}
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-BAAI/bge-m3}
      - EMBEDDING_VECTOR_SIZE=${EMBEDDING_VECTOR_SIZE:-1024}
      - DISTANCE_METRIC=${DISTANCE_METRIC:-Cosine}
      - OCR_ENABLED=${OCR_ENABLED:-true}
      - OCR_LANGUAGE=${OCR_LANGUAGE:-eng}
      - CACHE_ENABLED=${CACHE_ENABLED:-true}
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-300}
      - STT_PROVIDER=${STT_PROVIDER:-whisper_tiny}
      - WHISPER_MODEL=${WHISPER_MODEL:-tiny}
      - MULTILINGUAL_ENABLED=${MULTILINGUAL_ENABLED:-true}
      - EMBEDDING_MODEL_TYPE=${EMBEDDING_MODEL_TYPE:-bge-m3}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-false}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT}
      - GOOGLE_CLIENT_ID=${ECOSTANCE_GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${ECOSTANCE_GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${ECOSTANCE_GOOGLE_REDIRECT_URI}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:9002/ecostance-ui}
    volumes:
      - ./ecostance-agent-v1/uploads:/app/uploads
      - ./ecostance-agent-v1/data:/app/data
    ports:
      - "9000:9000"
    depends_on:
      - redis
      - ecostance-embedding
    restart: unless-stopped
    networks:
      - app-network

  # 4. Background Celery Worker (Handles binary/heavy tasks)
  ecostance-worker:
    build:
      context: ./ecostance-agent-v1
      dockerfile: Dockerfile
    container_name: ecostance-worker
    # Use -P solo for Windows/Simple Linux, or --concurrency=1 for stability
    command: celery -A app.worker.tasks worker --loglevel=info -P solo
    environment:
      - REDIS_URL=redis://redis:6379/0
      - USE_REMOTE_EMBEDDING=true
      - EMBEDDING_SERVER_HOST=ecostance-embedding
      - EMBEDDING_SERVER_PORT=9003
      - EMBEDDING_VECTOR_SIZE=${EMBEDDING_VECTOR_SIZE:-1024}
      - DATABASE_URL=${DATABASE_URL}
      - QDRANT_URL=${QDRANT_URL}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
    volumes:
      - ./ecostance-agent-v1/uploads:/app/uploads
      - ./ecostance-agent-v1/data:/app/data
    depends_on:
      - redis
      - ecostance-embedding
    restart: unless-stopped
    networks:
      - app-network

  # 5. UI Frontend
  ecostance-ui:
    build:
      context: ./ecostance-ui-v1
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://ecostance-agent:9000/api/v1}
        - VITE_ENVIRONMENT=${VITE_ENVIRONMENT:-production}
        - VITE_BYPASS_AUTH=${VITE_BYPASS_AUTH:-false}
    container_name: ecostance-ui
    depends_on:
      - ecostance-agent
    ports:
      - "9002:9002"
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
