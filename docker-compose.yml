version: '3.8'

services:
  # PostgreSQL Database (for CRM only)
  db:
    image: postgres:16-alpine
    container_name: crm-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-crm_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # Ecostance Agent Backend
  ecostance-agent:
    build:
      context: ./ecostance-agent-v1
      dockerfile: Dockerfile
    container_name: ecostance-agent
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - QDRANT_URL=${QDRANT_URL}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - AGENT_MODEL=${AGENT_MODEL:-llama-3.1-8b-instant}
      - AGENT_TEMPERATURE=${AGENT_TEMPERATURE:-0.3}
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-BAAI/bge-m3}
      - EMBEDDING_VECTOR_SIZE=${EMBEDDING_VECTOR_SIZE:-1024}
      - DISTANCE_METRIC=${DISTANCE_METRIC:-Cosine}
      - OCR_ENABLED=${OCR_ENABLED:-true}
      - OCR_LANGUAGE=${OCR_LANGUAGE:-eng}
      - CACHE_ENABLED=${CACHE_ENABLED:-true}
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-300}
      - STT_PROVIDER=${STT_PROVIDER:-whisper_tiny}
      - WHISPER_MODEL=${WHISPER_MODEL:-tiny}
      - MULTILINGUAL_ENABLED=${MULTILINGUAL_ENABLED:-true}
      - EMBEDDING_MODEL_TYPE=${EMBEDDING_MODEL_TYPE:-bge-m3}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-false}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT}
      - GOOGLE_CLIENT_ID=${ECOSTANCE_GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${ECOSTANCE_GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${ECOSTANCE_GOOGLE_REDIRECT_URI}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:9002}
    volumes:
      - ./ecostance-agent-v1/uploads:/app/uploads
      - ./ecostance-agent-v1/data:/app/data
    ports:
      - "9000:9000"
    restart: unless-stopped
    networks:
      - app-network

  # CRM Backend
  crm-backend:
    build:
      context: ./c-crm-be
      dockerfile: Dockerfile
    container_name: crm-backend
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-crm_db}
      - GOOGLE_CLIENT_ID=${CRM_GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${CRM_GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${CRM_GOOGLE_REDIRECT_URI}
      - CRM_SECRET_KEY=${CRM_SECRET_KEY}
      - ALGORITHM=${ALGORITHM:-HS256}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "9001:9001"
    restart: unless-stopped
    networks:
      - app-network

  # Ecostance UI Frontend
  ecostance-ui:
    build:
      context: ./ecostance-ui-v1
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://ecostance-agent:9000/api/v1}
        - VITE_ENVIRONMENT=${VITE_ENVIRONMENT:-production}
        - VITE_BYPASS_AUTH=${VITE_BYPASS_AUTH:-false}
    container_name: ecostance-ui
    depends_on:
      - ecostance-agent
    ports:
      - "9002:9002"
    restart: unless-stopped
    networks:
      - app-network

  # CRM Frontend
  crm-frontend:
    build:
      context: ./c-crm-fe
      dockerfile: Dockerfile
      args:
        - VITE_CRM_API_BASE_URL=${VITE_CRM_API_BASE_URL:-http://localhost:9001/api/v1}
        - VITE_ENVIRONMENT=${VITE_ENVIRONMENT:-production}
    container_name: crm-frontend
    depends_on:
      - crm-backend
    ports:
      - "9003:9003"
    restart: unless-stopped
    networks:
      - app-network

volumes:
  postgres_data:
    driver: local

networks:
  app-network:
    driver: bridge
