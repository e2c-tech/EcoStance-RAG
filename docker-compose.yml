version: '3.8'

services:
  # 1. Message Broker
  ecostance-redis:
    image: redis:alpine
    container_name: ecostance-redis
    restart: unless-stopped
    networks:
      - manual-app-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 500M

  # 2. Shared Embedding Server
  ecostance-embedding:
    image: sc-ai-agent-backend-core
    container_name: ecostance-embedding
    command: python -m app.services.embedding_server
    environment:
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-BAAI/bge-m3}
      - EMBEDDING_SERVER_PORT=9004
      - GPU_VRAM_LIMIT_MB=${GPU_VRAM_LIMIT_MB:-8192}
      - EMBEDDING_VECTOR_SIZE=${EMBEDDING_VECTOR_SIZE:-1024}
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ${BASE_PATH}/ecostance-agent-v1:/app
    ports:
      - "9006:9004"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9004/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - manual-app-network

  # 3. Main API Server
  ecostance-agent:
    image: sc-ai-agent-backend-core
    container_name: ecostance-agent
    environment:
      - REDIS_URL=redis://ecostance-redis:6379/0
      - USE_REMOTE_EMBEDDING=true
      - EMBEDDING_SERVER_HOST=ecostance-embedding
      - EMBEDDING_SERVER_PORT=9004
      - DB_POOL_SIZE=20
      - DB_MAX_OVERFLOW=40
      - DB_POOL_TIMEOUT=60
      - DB_POOL_RECYCLE=1800
      # Existing Config
      - DATABASE_URL=${DATABASE_URL}
      - QDRANT_URL=${QDRANT_URL}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - AGENT_MODEL=${AGENT_MODEL:-llama-3.1-8b-instant}
      - AGENT_TEMPERATURE=${AGENT_TEMPERATURE:-0.3}
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-BAAI/bge-m3}
      - EMBEDDING_VECTOR_SIZE=${EMBEDDING_VECTOR_SIZE:-1024}
      - DISTANCE_METRIC=${DISTANCE_METRIC:-Cosine}
      - OCR_ENABLED=${OCR_ENABLED:-true}
      - OCR_LANGUAGE=${OCR_LANGUAGE:-eng}
      - CACHE_ENABLED=${CACHE_ENABLED:-true}
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-300}
      - STT_PROVIDER=${STT_PROVIDER:-whisper_tiny}
      - WHISPER_MODEL=${WHISPER_MODEL:-tiny}
      - MULTILINGUAL_ENABLED=${MULTILINGUAL_ENABLED:-true}
      - EMBEDDING_MODEL_TYPE=${EMBEDDING_MODEL_TYPE:-bge-m3}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-false}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT}
      - GOOGLE_CLIENT_ID=${ECOSTANCE_GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${ECOSTANCE_GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${ECOSTANCE_GOOGLE_REDIRECT_URI}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:9008/ecostance-ui}
    volumes:
      - ${BASE_PATH}/ecostance-agent-v1:/app
      - ${BASE_PATH}/ecostance-agent-v1/uploads:/app/uploads
      - ${BASE_PATH}/ecostance-agent-v1/data:/app/data
    ports:
      - "9007:9000"
    depends_on:
      - ecostance-redis
      - ecostance-embedding
    restart: unless-stopped
    networks:
      - manual-app-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G

  # 4. Background Celery Worker
  ecostance-worker:
    image: sc-ai-agent-backend-core
    container_name: ecostance-worker
    command: celery -A app.worker.tasks:celery_app worker --loglevel=info --concurrency=4
    environment:
      - REDIS_URL=redis://ecostance-redis:6379/0
      - USE_REMOTE_EMBEDDING=true
      - EMBEDDING_SERVER_HOST=ecostance-embedding
      - EMBEDDING_SERVER_PORT=9004
      - EMBEDDING_VECTOR_SIZE=${EMBEDDING_VECTOR_SIZE:-1024}
      - DATABASE_URL=${DATABASE_URL}
      - QDRANT_URL=${QDRANT_URL}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-BAAI/bge-m3}
      - EMBEDDING_MODEL_TYPE=${EMBEDDING_MODEL_TYPE:-bge-m3}
      - DISTANCE_METRIC=${DISTANCE_METRIC:-Cosine}
      - OCR_ENABLED=${OCR_ENABLED:-true}
      - OCR_LANGUAGE=${OCR_LANGUAGE:-eng}
      - MULTILINGUAL_ENABLED=${MULTILINGUAL_ENABLED:-true}
      - WORKER_HEALTH_PORT=9008
    volumes:      
      - ${BASE_PATH}/ecostance-agent-v1:/app
      - ${BASE_PATH}/ecostance-agent-v1/uploads:/app/uploads
      - ${BASE_PATH}/ecostance-agent-v1/data:/app/data
    depends_on:
      - ecostance-redis
      - ecostance-embedding
    restart: unless-stopped
    networks:
      - manual-app-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 3G
    healthcheck:
      test: ["CMD", "celery", "-A", "app.worker.tasks:celery_app", "status"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 60s

  # # 5. UI Frontend
  # ecostance-ui:
  #   build:
  #     context: ./ecostance-ui-v1
  #     dockerfile: Dockerfile
  #     args:
  #       - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:9007/api/v1}
  #       - VITE_ENVIRONMENT=${VITE_ENVIRONMENT:-production}
  #       - VITE_BYPASS_AUTH=${VITE_BYPASS_AUTH:-false}
  #   container_name: ecostance-ui
  #   depends_on:
  #     - ecostance-agent
  #   ports:
  #     - "9008:9002"
  #   restart: unless-stopped
  #   networks:
  #     - app-network

networks:
  manual-app-network:
    external: true
